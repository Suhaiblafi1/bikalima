<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <title>بكلمة - صناعة الأثر وفن الإلقاء والخطابة</title>
    <meta name="description" content="بكلمة — منهجية شاملة لصناعة الأثر وفن الإلقاء والخطابة. برامج متخصصة للأفراد والمدربين والمعلمين والأطفال." />
    <meta name="keywords" content="بكلمة, خطابة, إلقاء, صهيب الخوالدة, تدريب الخطابة, المتحدث المؤثر, public speaking, Bikalima" />
    <meta name="theme-color" content="#258f86" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon and home-screen icons. The PNGs are the SVG rendered in a
         browser, so the letter is shaped the same way people already see it —
         rendering the SVG with a headless rasteriser clipped the glyph, since
         it has no access to the same font fallback. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="alternate icon" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <!-- Real name, colours and icons when someone adds the site to their home
         screen. Not a full PWA: there is no service worker, so Chrome will not
         offer its install prompt and nothing works offline. -->
    <link rel="manifest" href="%BASE_URL%manifest.json" />

    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="بكلمة" />
    <meta property="og:url" content="https://bikalima.com/" />
    <meta property="og:title" content="بكلمة - صناعة الأثر وفن الإلقاء والخطابة" />
    <meta property="og:description" content="منهجية شاملة لصناعة الأثر وفن الإلقاء والخطابة — برامج للأفراد والمدربين والمعلمين والأطفال." />
    <meta property="og:image" content="https://bikalima.com/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="بكلمة - صناعة الأثر وفن الإلقاء والخطابة" />
    <meta property="og:locale" content="ar_AR" />


    <!-- schema.org: the site-wide graph. Static on purpose — a crawler that
         does not run JavaScript still gets the organisation and the site,
         which the per-page Course and FAQPage blocks cannot promise. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "EducationalOrganization",
            "@id": "https://bikalima.com/#organization",
            "name": "بكلمة",
            "alternateName": "Bikalima",
            "url": "https://bikalima.com",
            "logo": "https://bikalima.com/opengraph.jpg",
            "email": "info@bikalima.com",
            "description": "مؤسسة تعليمية وتدريبية متخصصة في بناء مهارات الخطابة والتواصل للشباب والمهنيين والمعلمين.",
            "address": { "@type": "PostalAddress", "addressCountry": "JO" },
            "areaServed": { "@type": "Place", "name": "الأردن والعالم العربي" },
            "founder": { "@type": "Person", "name": "صهيب الخوالدة" },
            "sameAs": [
              "https://www.instagram.com/suhaiblafi/",
              "https://www.linkedin.com/in/suhaiblafi/"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://bikalima.com/#website",
            "url": "https://bikalima.com",
            "name": "بكلمة",
            "inLanguage": "ar",
            "publisher": { "@id": "https://bikalima.com/#organization" }
          }
        ]
      }
    </script>

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="بكلمة - صناعة الأثر وفن الإلقاء والخطابة" />
    <meta name="twitter:description" content="منهجية شاملة لصناعة الأثر وفن الإلقاء والخطابة." />
    <meta name="twitter:image" content="https://bikalima.com/opengraph.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
