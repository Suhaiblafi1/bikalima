name: Manage admin access (production)

# Roles live in the database, never in a config file or an email allow-list,
# so the only way to create the first admin is to write the row. This does it
# without the production URL leaving GitHub Secrets, and GitHub records who
# ran it and when.
#
# "list" changes nothing and needs no confirmation — use it to answer
# "who is admin already?".
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        required: true
        default: list
        options:
          - list
          - inspect
          - grant
          - revoke
          - delete
      email:
        description: "Account to act on. Ignored by list."
        required: false
        default: ""
      confirm:
        description: 'Retype the action word ("grant", "revoke" or "delete") to confirm.'
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: grant-admin
  cancel-in-progress: false

jobs:
  grant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check the confirmation
        run: |
          ACTION='${{ inputs.action }}'
          if [ "$ACTION" = "list" ]; then
            echo "Listing only — nothing will be changed."
            exit 0
          fi
          if [ "$ACTION" = "inspect" ]; then
            if [ -z '${{ inputs.email }}' ]; then
              echo "::error::inspect needs an email address."
              exit 1
            fi
            echo "Read-only report — nothing will be changed."
            exit 0
          fi
          if [ -z '${{ inputs.email }}' ]; then
            echo "::error::$ACTION needs an email address."
            exit 1
          fi
          if [ '${{ inputs.confirm }}' != "$ACTION" ]; then
            echo "::error::Confirmation missing — type exactly: $ACTION"
            exit 1
          fi
          if [ "$ACTION" = "delete" ]; then
            echo "::warning::delete removes the account row and every row cascading from it. This cannot be undone."
          fi

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Same pre-flight as the migration workflow: refuse a URL that cannot
      # work and name the broken part, rather than failing mid-statement.
      - name: Check the connection
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        # pnpm links `pg` under lib/db only, so resolve from there.
        working-directory: lib/db
        run: node check-connection.mjs

      - name: Run the action
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          ADMIN_EMAIL: ${{ inputs.email }}
          ACTION: ${{ inputs.action }}
        working-directory: lib/db
        run: node grant-admin.mjs
