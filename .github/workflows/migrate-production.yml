name: Apply database migrations (production)

# Never runs on its own. A person opens Actions → this workflow → Run
# workflow, and must type the two confirmations below. That keeps the
# deliberate, backup-first sequence the deployment runbook requires while
# letting the credential live in GitHub Secrets rather than on a laptop.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to run the pending migrations against PRODUCTION'
        required: true
        default: ""
      backup_taken:
        description: 'Type "yes" to confirm a restorable backup was taken first (runbook §3.1)'
        required: true
        default: ""

permissions:
  contents: read

# One migration at a time, and never cancelled midway.
concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check the confirmations
        run: |
          if [ "${{ inputs.confirm }}" != "apply" ]; then
            echo "::error::Confirmation missing — type exactly: apply"
            exit 1
          fi
          if [ "${{ inputs.backup_taken }}" != "yes" ]; then
            echo "::error::Backup not confirmed. Take one first (runbook §3.1), then type: yes"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Refuses to continue on a URL that cannot work, and names which part
      # is wrong. Run #1 failed here with a bare "EAI_AGAIN host" from inside
      # drizzle because this step used to swallow connection errors as
      # "no migrations applied yet".
      - name: Check the connection and show what is pending
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        # pnpm links `pg` under lib/db only, so resolve from there.
        working-directory: lib/db
        run: node check-connection.mjs

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm --filter @workspace/db migrate

      # Confirm the database now stands at the same migration as the repo.
      # Compares drizzle's own ledger against the journal — no bundler, no
      # schema import, nothing that can break on a dependency layout change.
      - name: Verify every migration applied
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        working-directory: lib/db
        run: |
          node -e "
            const pg = require('pg');
            const expected = require('./drizzle/meta/_journal.json').entries.length;
            const c = new pg.Client({ connectionString: process.env.DATABASE_URL });
            c.connect()
              .then(() => c.query('select count(*)::int as n from drizzle.__drizzle_migrations'))
              .then((r) => {
                const applied = r.rows[0].n;
                console.log('migrations in repository: ' + expected);
                console.log('applied in production:    ' + applied);
                if (applied === expected) {
                  console.log('Production is up to date.');
                } else {
                  console.error('::error::' + (expected - applied) + ' migration(s) still pending — the deploy is NOT complete.');
                  process.exitCode = 1;
                }
              })
              .catch((e) => { console.error('::error::Could not read the migration ledger: ' + e.message); process.exitCode = 1; })
              .finally(() => c.end());
          "
